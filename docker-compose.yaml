# Optional: run the API and worker containers (the same images Cloud Run uses)
# against a local Supabase stack started with `npx supabase start`.
# Day-to-day development runs them with `uv run` instead; see docs/LOCAL_DEVELOPMENT.md.
#
#   docker compose up --build
#
# Settings come from the repository root .env; the values below point the
# containers at Supabase running on the host.
services:
  api:
    build:
      context: .
      dockerfile: src/edu-api/Dockerfile
    ports:
      - "8010:8000"
    env_file: .env
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@host.docker.internal:54322/postgres
      SUPABASE_URL: http://host.docker.internal:54321
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: .
      dockerfile: src/edu-worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@host.docker.internal:54322/postgres
      SUPABASE_URL: http://host.docker.internal:54321
      WORKER_CONCURRENCY: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
