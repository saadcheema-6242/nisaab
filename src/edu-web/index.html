<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#F6F7F4"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#121815"
    />

      name="description"
      content="AI tutor for FBISE FSc (HSSC) students: syllabus by SLO, practice, and exam-style answers"

    <!-- iOS does not read the manifest. Added to Home Screen, Safari
         reads these instead: without the first one the app opens in a
         Safari window with the address bar, which is the thing
         installing it was meant to remove. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NISAAB" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="/manifest.json" />
    <title>NISAAB: AI tutor for FBISE FSc</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
